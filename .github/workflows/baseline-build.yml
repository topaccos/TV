name: TV baseline build
on:
  push:
    branches: [build/baseline-check]
    paths: ['.github/workflows/baseline-build.yml', 'ci-player-build/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: baseline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    if: github.ref == 'refs/heads/build/baseline-check'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare test signing
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/baseline.jks" -storetype JKS -alias ci-baseline -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 30 -dname 'CN=Disposable TV CI Test'
          printf 'sdk.dir=%s\nstoreFile=%s\nkeyAlias=ci-baseline\nstorePassword=android\n' "$ANDROID_HOME" "$RUNNER_TEMP/baseline.jks" > local.properties
          git rev-parse HEAD > ci-logs/source-sha.txt
      - name: Install SDK and native toolchain
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;37.0.0' 'platforms;android-36' 'cmake;3.22.1' 'ndk;30.0.16248370' 2>&1 | tee ci-logs/sdk-install.log
      - name: Build pinned player dependencies
        id: media
        run: |
          set -euo pipefail
          bash ci-player-build/build-media.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/tv-media" 2>&1 | tee ci-logs/player-build.log
      - name: Assemble Leanback Debug
        id: build
        if: ${{ !cancelled() && steps.media.outcome == 'success' }}
        run: |
          set -euo pipefail
          bash ./gradlew --no-daemon --console=plain --stacktrace :app:assembleLeanbackDebug 2>&1 | tee ci-logs/assemble.log
          shopt -s globstar nullglob
          apks=(app/build/outputs/apk/leanback/debug/**/*.apk)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            sha256sum "$apk"
            "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging "$apk"
          done | tee ci-logs/apk-info.log
      - name: Summarize errors
        if: ${{ !cancelled() && failure() }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for name in ('sdk-install.log','player-build.log','assemble.log'):
              p=Path('ci-logs')/name
              if not p.exists(): continue
              lines=p.read_text(errors='replace').splitlines()
              selected=[]
              for i,line in enumerate(lines):
                  if re.search(r'error|exception|failed|not found|could not|couldn.t|what went wrong|caused by',line,re.I):
                      for item in lines[max(0,i-1):i+5]:
                          if item.strip() and item.strip() not in selected: selected.append(item.strip())
                      if len(selected)>=26: break
              if not selected: continue
              msg='\n'.join(selected[:26])[:6000].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::error title='+name+'::'+msg)
          PY
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseline-logs-${{ github.run_id }}
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload test APKs
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: leanback-debug-test-only-${{ github.run_id }}
          path: app/build/outputs/apk/leanback/debug/**/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Clean up test signing
        if: always()
        run: rm -f -- "$RUNNER_TEMP/baseline.jks" "$GITHUB_WORKSPACE/local.properties"
