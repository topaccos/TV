import org.gradle.api.artifacts.component.ModuleComponentIdentifier

gradle.projectsEvaluated {
    def root = gradle.rootProject
    root.tasks.register('exportTvRuntimeDependencies') {
        doLast {
            def names = root.file('move.txt').readLines().findAll { it.trim() }.collect {
                it.replace('-release.aar', '')
            }
            def coordinates = new TreeSet<String>()
            names.each { name ->
                def module = root.project(":" + name)
                module.configurations.getByName('releaseRuntimeClasspath').incoming.resolutionResult.allComponents.each { component ->
                    if (component.id instanceof ModuleComponentIdentifier) {
                        def id = component.id
                        if (id.group == 'androidx.media3') {
                            throw new GradleException("Unexpected official Media3 binary mixed into custom source build: ${id}")
                        }
                        // TV already supplies the API-compatible patched RTMP implementation.
                        if (!(id.group == 'io.antmedia' && id.module == 'rtmp-client')) {
                            coordinates.add("${id.group}:${id.module}:${id.version}")
                        }
                    }
                }
            }
            def output = root.layout.buildDirectory.file('tv-consumer-dependencies.gradle').get().asFile
            output.parentFile.mkdirs()
            output.text = '// External runtime closure for local custom Media3 AARs.\nconfigurations.configureEach { exclude group: \'io.antmedia\', module: \'rtmp-client\' }\ndependencies {\n' + coordinates.collect { "    implementation '${it}'" }.join('\n') + '\n}\n'
            println("Exported ${coordinates.size()} external dependencies: ${output}")
        }
    }
}
